syntax = "proto3";

option csharp_namespace = "Marketplace.Grpc";

package marketplace;

// BaseForge.CodeGen tarafından üretildi — Offer entity'sine diğer servislerin
// salt-okunur gRPC erişimi. Servis adı (OfferService), C# implementasyon sınıfıyla
// (OfferGrpcService) çakışmasın diye ayrı tutulur.
service OfferService {
  rpc GetById (OfferByIdRequest) returns (OfferMessage);
}

message OfferByIdRequest {
  string id = 1;
}

message OfferMessage {
  string id = 1;
  string amount = 2;
  string status = 3;
}
