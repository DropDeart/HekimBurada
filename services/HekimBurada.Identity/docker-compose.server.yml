# identity prod deploy — kendi izole Postgres'i + paylaşılan hekimburada-prod-network.
# REST portu (8080->127.0.0.1:5090) nginx için host'a publish edilir; gRPC (8081) SADECE
# network üzerinden container adıyla erişilir, host'a publish edilmez.
services:
  postgres:
    image: postgres:17-alpine
    container_name: hekimburada-identity-postgres
    env_file:
      - .env.server
    environment:
      POSTGRES_USER: hekimburada
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: hekimburada_identity_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hekimburada -d hekimburada_identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5460:5432"
    volumes:
      - identity-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  identity:
    build: .
    image: hekimburada-identity:local
    container_name: hekimburada-identity
    env_file:
      - .env.server
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Auth__Issuer: "https://identity.hekimburada.com/"
      Auth__SeedAdmin__Password: ${SEED_ADMIN_PASSWORD}
      Auth__SigningCertificatePath: /app/certs/signing.pfx
      Auth__SigningCertificatePassword: ${SIGNING_CERT_PASSWORD}
      Auth__EncryptionCertificatePath: /app/certs/encryption.pfx
      Auth__EncryptionCertificatePassword: ${ENCRYPTION_CERT_PASSWORD}
      Auth__Providers__Google__ClientId: "855788802789-mskhaukbtbp23gludd4nk12h7f4r19rv.apps.googleusercontent.com"
      Auth__Providers__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Auth__Providers__Facebook__ClientId: "1556188442902812"
      Auth__Providers__Facebook__ClientSecret: ${FACEBOOK_CLIENT_SECRET}
      Smtp__Host: smtp.resend.com
      Smtp__Port: "465"
      Smtp__Username: resend
      Smtp__Password: ${RESEND_API_KEY}
      Smtp__UseSsl: "true"
      ConnectionStrings__Default: "Host=hekimburada-identity-postgres;Port=5432;Database=hekimburada_identity_db;Username=hekimburada;Password=${PG_PASSWORD}"
      Cors__AllowedOrigins__0: "https://hekimburada.com"
      Cors__AllowedOrigins__1: "https://www.hekimburada.com"
      RabbitMq__Host: hekimburada-rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5090:8080"
    volumes:
      - ./certs:/app/certs:ro
      - identity-avatars:/app/wwwroot/uploads
      - identity-verification-docs:/app/uploads
    networks:
      - default
      - hekimburada-prod-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  identity-pgdata:
  identity-avatars:
  identity-verification-docs:

networks:
  hekimburada-prod-network:
    external: true
