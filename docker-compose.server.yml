# HekimBurada prod — paylaşılan RabbitMQ. Diğer servisler hekimburada-prod-network
# üzerinden container adıyla (hekimburada-rabbitmq) bağlanır, host'a port publish edilmez.
services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: hekimburada-rabbitmq
    env_file:
      - .env.server
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - hekimburada-prod-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

networks:
  hekimburada-prod-network:
    external: true
