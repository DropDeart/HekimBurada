# gateway prod deploy — kendi izole Postgres'i + paylaşılan hekimburada-prod-network.
services:
  postgres:
    image: postgres:17-alpine
    container_name: hekimburada-gateway-postgres
    env_file:
      - .env.server
    environment:
      POSTGRES_USER: hekimburada
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: hekimburada_gateway_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hekimburada -d hekimburada_gateway_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5461:5432"
    volumes:
      - gateway-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  gateway:
    build: .
    image: hekimburada-gateway:local
    container_name: hekimburada-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=hekimburada-gateway-postgres;Port=5432;Database=hekimburada_gateway_db;Username=hekimburada;Password=${PG_PASSWORD}"
      Cors__AllowedOrigins__0: "https://hekimburada.com"
      Cors__AllowedOrigins__1: "https://www.hekimburada.com"
      Auth__Authority: "http://hekimburada-identity:8080"
      Grpc__Identity: "http://hekimburada-identity:8081"
      ReverseProxy__Clusters__marketplace-cluster__Destinations__destination1__Address: "http://hekimburada-marketplace:8080/"
      ReverseProxy__Clusters__community-cluster__Destinations__destination1__Address: "http://hekimburada-community:8080/"
      ReverseProxy__Clusters__messaging-cluster__Destinations__destination1__Address: "http://hekimburada-messaging:8080/"
    env_file:
      - .env.server
    ports:
      - "127.0.0.1:8300:8080"
    volumes:
      - gateway-uploads:/app/wwwroot/uploads
    networks:
      - default
      - hekimburada-prod-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gateway-pgdata:
  gateway-uploads:

networks:
  hekimburada-prod-network:
    external: true
