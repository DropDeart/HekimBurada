syntax = "proto3";

option csharp_namespace = "Marketplace.Grpc";

package marketplace;

// BaseForge.CodeGen tarafından üretildi — Request entity'sine diğer servislerin
// salt-okunur gRPC erişimi. Servis adı (RequestService), C# implementasyon sınıfıyla
// (RequestGrpcService) çakışmasın diye ayrı tutulur.
service RequestService {
  rpc GetById (RequestByIdRequest) returns (RequestMessage);
}

message RequestByIdRequest {
  string id = 1;
}

message RequestMessage {
  string id = 1;
  string title = 2;
  string description = 3;
  string budget_max = 4;
  string status = 5;
}
