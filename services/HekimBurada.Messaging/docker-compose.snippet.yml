# Bu bloğu kök docker-compose.yml'a ekleyin (postgres servisinin yanına).
# Merkezi log toplama (Grafana Loki) da kökteki docker-compose.yml'da paylaşılan bir container'dır.
services:
  messaging-service:
    build: .
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=hekimburada_messaging_db;Username=baseforge;Password=change_me"
    depends_on:
      postgres:
        condition: service_healthy
